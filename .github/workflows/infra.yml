name: infra

# Pipeline de infraestructura. Es dueno de la existencia y la configuracion
# de la funcion, y no toca la imagen.

on:
  pull_request:
    paths:
      - 'infra/**'
  push:
    branches:
      - main
    paths:
      - 'infra/**'
  workflow_dispatch:

jobs:

  # Dos comprobaciones: inicializacion contra el backend remoto y validacion.
  # Condicion de detencion: cualquiera de las dos falla.
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Credenciales temporales
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Inicializar contra el backend remoto
        working-directory: infra
        run: terraform init -backend-config=backend.hcl

      - name: Validar
        working-directory: infra
        run: terraform validate

  # Detiene el pipeline. Solo escanea infra/, falla ante HIGH o CRITICAL.
  politicas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Analizar politicas de infraestructura con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: 'infra'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

  # Depende de validar y politicas. Calcula el plan una sola vez; lo que se
  # aplica despues es este archivo, no un recalculo.
  plan:
    needs: [validar, politicas]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Credenciales temporales
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Inicializar contra el backend remoto
        working-directory: infra
        run: terraform init -backend-config=backend.hcl

      - name: Calcular el plan
        working-directory: infra
        run: terraform plan -out=tfplan

      - name: Exportar el plan a JSON
        working-directory: infra
        run: terraform show -json tfplan > tfplan.json

      - name: Generar el plan en texto legible
        if: github.event_name == 'pull_request'
        working-directory: infra
        run: terraform show -no-color tfplan > plan_legible.txt

      - name: Publicar el plan como comentario del pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/plan_legible.txt', 'utf8');
            const body = `### Plan de Terraform\n\n<details><summary>Ver plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n\n</details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      # TODO: Regla 1, sobre acciones de destruccion sin autorizacion.
      # Falta el mecanismo de autorizacion humana antes de implementarla.

  # TODO
  # Aplicar el plan que produjo el job anterior, sin recalcularlo.
  # Corre solo desde la rama principal y solo si la compuerta del plan paso.
  # Condicion de detencion: el apply falla.
  # Sustituir el paso centinela por la implementacion.
  aplicar:
    needs: plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Sin implementar
        run: |
          echo "::error::El job 'aplicar' no esta implementado."
          exit 1